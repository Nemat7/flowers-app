<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>v7 · 02 — Магазин</title>
<link rel="stylesheet" href="theme.css">
<style>body{padding-bottom:190px}</style>
<style>
  .cover { height:236px; position:relative; }
  .rbtn {
    position:absolute; top:58px; left:20px; width:42px; height:42px; border-radius:50%;
    background:rgba(251,248,244,.94); display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-s); z-index:4;
  }
  .head { padding:0 20px; margin-top:-30px; position:relative; }
  .head .logo { width:66px; height:66px; border-radius:50%; overflow:hidden; border:3px solid var(--paper); }
  .head h1 { font-size:29px; line-height:1.08; margin-top:12px; }
  .head .row { display:flex; align-items:center; gap:9px; margin-top:9px; font-size:12px; font-weight:600; color:var(--ink-2); white-space:nowrap; }
  .head .row s { width:3px; height:3px; border-radius:50%; background:var(--ink-3); display:block; }
  .head .open { color:var(--leaf); font-weight:700; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:22px 14px; padding:0 20px; }
  .card .ph { height:196px; position:relative; }
  .card .ph .add {
    position:absolute; right:8px; bottom:8px; width:32px; height:32px; border-radius:50%;
    background:var(--paper); display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:500; box-shadow:var(--shadow-s);
  }
  .card .ph .seal { position:absolute; left:10px; bottom:10px; }
  .card .nm { font-size:16px; line-height:1.15; margin-top:10px; }
  .card .pr { font-size:13px; font-weight:700; margin-top:4px; }

  .cartpill {
    position:fixed; left:20px; right:20px; bottom:104px; height:56px; border-radius:999px;
    background:var(--ink); color:#fff; display:flex; align-items:center; gap:10px; padding:0 20px;
    z-index:22; box-shadow:var(--shadow);
  }
  .cartpill .n {
    width:24px; height:24px; border-radius:50%; background:var(--clay); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;
  }
  .cartpill .t { font-size:14px; font-weight:700; }
  .cartpill .s { margin-left:auto; font-size:14px; font-weight:700; }
</style>
</head>
<body>

<div class="cover arch-b">
  <img src="../../references/photos/crop/b3.jpg" alt="">
</div>
<div class="rbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#171310" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<div class="head">
  <div class="logo"><img src="../../references/photos/bloom logo.jpg" alt=""></div>
  <h1 class="display">Bloom · цветочная мастерская</h1>
  <div class="row">
    <span style="color:var(--ink)">★ 4.9</span><s></s>
    <span class="open">Открыто до 22:00</span><s></s>
    35–45 мин<s></s>от 50 с.
  </div>
</div>

<div class="sechead" style="padding-bottom:12px"><div class="l"><h2 class="display">Витрина</h2></div></div>
<div class="rail" style="padding-bottom:22px">
  <div class="chip on">Всё</div>
  <div class="chip">Букеты</div>
  <div class="chip">Композиции</div>
  <div class="chip">Открытки</div>
</div>

<div class="grid">
  <div class="card">
    <div class="ph arch"><img src="../../references/photos/crop/b1.jpg" alt=""><div class="seal sm">F</div><div class="add">+</div></div>
    <div class="nm display">Гортензия с орхидеей</div>
    <div class="pr">450 с.</div>
  </div>
  <div class="card">
    <div class="ph arch"><img src="../../references/photos/crop/g2.jpg" alt=""><div class="add">+</div></div>
    <div class="nm display">25 белых роз</div>
    <div class="pr">450 с.</div>
  </div>
  <div class="card">
    <div class="ph arch"><img src="../../references/photos/crop/b2.jpg" alt=""><div class="add">+</div></div>
    <div class="nm display">Букет «Облако»</div>
    <div class="pr">420 с.</div>
  </div>
  <div class="card">
    <div class="ph arch"><img src="../../references/photos/crop/b4.jpg" alt=""><div class="seal sm">F</div><div class="add">+</div></div>
    <div class="nm display">Пионовидные розы</div>
    <div class="pr">520 с.</div>
  </div>
</div>

<div class="cartpill">
  <div class="n">2</div>
  <div class="t">Корзина</div>
  <div class="s">535 с. →</div>
</div>

<div class="nav">
  <div class="it on">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.5Z" stroke="#C0563E" stroke-width="1.9" stroke-linejoin="round"/></svg>
    <span>Главная</span>
  </div>
  <div class="it">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#A79C90" stroke-width="1.9"/><path d="m20 20-3.5-3.5" stroke="#A79C90" stroke-width="1.9" stroke-linecap="round"/></svg>
    <span>Поиск</span>
  </div>
  <div class="it">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21V3Z" stroke="#A79C90" stroke-width="1.9" stroke-linejoin="round"/><path d="M9 8h6M9 12h6" stroke="#A79C90" stroke-width="1.9" stroke-linecap="round"/></svg>
    <span>Заказы</span>
  </div>
  <div class="it">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#A79C90" stroke-width="1.9"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5" stroke="#A79C90" stroke-width="1.9" stroke-linecap="round"/></svg>
    <span>Профиль</span>
  </div>
</div>
<div class="homebar"></div>

</body>
</html>

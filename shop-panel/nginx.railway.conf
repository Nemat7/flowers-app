# nginx-конфиг панели для Railway (используется как template: ${PORT} подставит entrypoint).
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: все неизвестные пути — на index.html (роутинг на клиенте).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Долгий кэш для хэшированных ассетов Vite.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
